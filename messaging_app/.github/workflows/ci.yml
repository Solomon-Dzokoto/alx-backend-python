name: CI

on:
  push:
    paths:
      - 'messaging_app/**'
  pull_request:
    paths:
      - 'messaging_app/**'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install pytest pytest-django pytest-cov flake8

      - name: Wait for MySQL
        run: |
          for i in {1..30}; do mysqladmin ping -h127.0.0.1 -uroot -proot && break || sleep 1; done

      - name: Run flake8
        run: flake8 .

      - name: Run tests with coverage
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/test_db
        run: |
          mkdir -p reports
          pytest -q messaging_app -v --junitxml=reports/junit.xml --cov=messaging_app --cov-report xml:reports/coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v3
        with:
          name: coverage-report
          path: reports/coverage.xml

      - name: Upload junit
        uses: actions/upload-artifact@v3
        with:
          name: junit-report
          path: reports/junit.xml
